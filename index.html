<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><rect x='9' y='33' width='82' height='13' rx='6.5' fill='%2338bdf8'/><path d='M57 53 L40 76 h10 l-6 18 18-24 h-10 z' fill='%23f59e0b'/></svg>">

<script>/* GoatCounter sans cookie, comme les autres pages ; rien n'est compté en local */
if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ var s = document.createElement('script'); s.async = true; s.src = 'https://gc.zgo.at/count.js'; s.setAttribute('data-goatcounter', 'https://foilhouse.goatcounter.com/count'); document.head.appendChild(s); }</script>
<style>
  :root{--bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8; --sky:#38bdf8; --amber:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;}
  main{max-width:960px; margin:0 auto; padding:40px 16px 56px;}
  header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  h1{margin:0; font-size:clamp(1.7rem, 5vw, 2.6rem); line-height:1.15;}
  h1 b{color:var(--sky);}
  .sub{color:var(--mut); margin:10px 0 28px; max-width:46ch;}
  .lang{display:flex; gap:6px;}
  .lang a{color:var(--mut); text-decoration:none; font-weight:700; font-size:.85rem; padding:4px 9px; border:1px solid var(--line); border-radius:999px;}
  .lang a.on{color:var(--bg); background:var(--sky); border-color:var(--sky);}
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;}
  .c{display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px; color:inherit; text-decoration:none; transition:transform .15s, border-color .15s;}
  .c:hover, .c:focus-visible{transform:translateY(-2px); border-color:var(--sky); outline:none;}
  .c .e{font-size:1.8rem;}
  .c h2{margin:6px 0 4px; font-size:1.15rem;}
  .c p{margin:0; color:var(--mut); font-size:.93rem;}
  .c.star{border-color:var(--amber); background:linear-gradient(135deg, #1e293b, #2a2414);}
  .c.star h2{color:var(--amber);}
  footer{margin-top:36px; color:var(--mut); font-size:.85rem;}
  footer a{color:var(--sky);}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
    <nav class="lang" aria-label="Langue"><a href="./" data-l="fr">FR</a><a href="./?lang=en" data-l="en">EN</a></nav>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="ft"></footer>
</main>
<script>
var L = /[?&]lang=en\b/i.test(location.search) ? 'en' : 'fr', Q = L === 'en' ? '?lang=en' : '';
var T = {
  fr: {h1: 'Le simulateur de <b>pump foil</b>', sub: 'La physique du foil, expliquée et jouable. Choisis ta partie.', ft: 'Par <a href="https://www.instagram.com/polofoil/">@polofoil</a> · Foil House',
    cards: [['dock.html', '🎮', 'Le jeu : Le Dock', 'Le défi des 2 minutes : lis la houle, pumpe, carve, attrape les lettres. Tu penses y arriver ?', 1],
      ['long-distance.html', '⚡', 'Longue distance', 'Compare 2 ailes : watts, Wh/km, aspect ratio, envergure. Plus de 300 ailes, selon ton poids.'],
      ['carve.html', '🌊', 'Carve', 'Virer sur la houle : vitesse, angle, et ce que la vague te donne.'],
      ['debutant.html', '🎓', 'Débuter', 'Bien choisir son matos et ses premières sessions.'],
      ['vitesse.html', '🚀', 'Vitesse', 'Jusqu’où peut aller ton aile, et pourquoi.'],
      ['formules.html', '📐', 'Nos formules', 'Toute la physique derrière les chiffres.']]},
  en: {h1: 'The <b>pump foil</b> simulator', sub: 'Foil physics, explained and playable. Pick your part.', ft: 'By <a href="https://www.instagram.com/polofoil/">@polofoil</a> · Foil House',
    cards: [['dock.html', '🎮', 'The game: The Dock', 'The 2-minute challenge: read the swell, pump, carve, grab the letters. Think you can do it?', 1],
      ['long-distance.html', '⚡', 'Long distance', 'Compare 2 wings: watts, Wh/km, aspect ratio, span. 300+ wings, for your weight.'],
      ['carve.html', '🌊', 'Carve', 'Turning on the swell: speed, angle, and what the wave gives you.'],
      ['debutant.html', '🎓', 'Getting started', 'Pick the right gear and nail your first sessions.'],
      ['vitesse.html', '🚀', 'Speed', 'How fast your wing can go, and why.'],
      ['formules.html', '📐', 'Our formulas', 'All the physics behind the numbers.']]}
}[L];
document.documentElement.lang = L;
if(L === 'en'){ document.title = 'Pump foil simulator | Foil House'; document.querySelector('meta[name=description]').content = 'The Foil House pump foil simulator: a game, a long-distance wing comparator, carving, speed, getting started and our formulas.'; document.querySelector('link[rel=canonical]').href = 'https://simulator.foil-house.com/?lang=en'; }
document.getElementById('h1').innerHTML = T.h1; document.getElementById('sub').textContent = T.sub; document.getElementById('ft').innerHTML = T.ft;
document.getElementById('grid').innerHTML = T.cards.map(function(c){ return '<a class="c' + (c[4] ? ' star' : '') + '" href="' + c[0] + Q + '"><span class="e" aria-hidden="true">' + c[1] + '</span><h2>' + c[2] + '</h2><p>' + c[3] + '</p></a>'; }).join('');
document.querySelectorAll('.lang a').forEach(function(a){ a.classList.toggle('on', a.dataset.l === L); });
</script>
</body>
</html>
